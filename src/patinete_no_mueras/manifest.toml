id = "patinete-no-mueras"
name = "Patinete No Mueras"
version = "0.1.0"
requires_api = "0.4"
description = "POV en monopatín eléctrico: semáforos, colectivos y motos."
locales = ["es"]
default_locale = "es"
players = [1, 1]
modes = ["partida"]

[controller]
layout = "motion"
skin = "toxinator"
orientation = "auto"
action = "Mirar atrás"
back = "Volver"
hint = "Incliná para doblar · tirá atrás para frenar · ×: mirar atrás"
gestures = ["steer", "tilt"]

[controller.labels]
cross = "Mirar atrás"
circle = "Volver"

[controller.gesture_labels]
steer = "Doblar"
tilt = "Frenar"

[art]
motif = "auto"
