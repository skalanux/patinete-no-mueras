id = "patinete-no-mueras"
name = "Patinete No Mueras"
version = "0.1.0"
requires_api = "0.3"
description = "POV en monopatín eléctrico: semáforos, colectivos y motos."
locales = ["es"]
default_locale = "es"
players = [1, 1]
modes = ["partida"]

[controller]
layout = "motion"
skin = "toxinator"
orientation = "auto"
action = "Mirar atrás"
back = "Volver"
hint = "Incliná para doblar · tirá atrás para frenar · ×: mirar atrás"

[controller.labels]
cross = "Mirar atrás"
circle = "Volver"

[art]
motif = "auto"
